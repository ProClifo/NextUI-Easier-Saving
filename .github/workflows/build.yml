---
name: Build

# yamllint disable-line rule:truthy
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # the NextUI toolchain images are arm64
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with sources.txt
        platform: [tg5040, tg5050, h700]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.platform }}
        run: ./scripts/build.sh ${{ matrix.platform }}
        env:
          # releases report their tag, everything else dev-<commit>
          PAK_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.platform }}
          path: build/stage/

  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: stage-*
          merge-multiple: true
          path: stage/

      - name: Zip
        run: |
          mkdir -p dist
          find stage -name '*.sh' -o -name '*.elf' | xargs -d '\n' chmod +x
          (cd stage && zip -r -X "../dist/Easier Saving.zip" Tools)

      # what update.sh on the device downloads: one archive per platform plus
      # latest.txt with each archive's checksum and the NextUI it was built for
      - name: Update archives
        run: |
          set -e
          version=""
          for pak in stage/Tools/*/"Easier Saving.pak"; do
            platform="$(basename "$(dirname "$pak")")"
            version="$(cat "$pak/version.txt")"
            tar -czf "dist/easier-saving-$platform.tar.gz" -C "$pak" .
            sha="$(sha256sum "dist/easier-saving-$platform.tar.gz" | cut -d' ' -f1)"
            echo "$platform $sha $(cat "$pak/nextui-commit.txt")" >> dist/platforms.txt
          done
          { echo "version $version"; cat dist/platforms.txt; } > dist/latest.txt
          rm dist/platforms.txt
          cat dist/latest.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Easier Saving
          path: dist/Easier Saving.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Easier Saving.zip
            dist/easier-saving-*.tar.gz
            dist/latest.txt
          generate_release_notes: true
