---
name: Build

# yamllint disable-line rule:truthy
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # the NextUI toolchain images are arm64
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        platform: [tg5040, tg5050, h700]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.platform }}
        run: ./scripts/build.sh ${{ matrix.platform }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.platform }}
          path: build/stage/

  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: stage-*
          merge-multiple: true
          path: stage/

      - name: Zip
        run: |
          mkdir -p dist
          find stage -name '*.sh' -o -name '*.elf' | xargs -d '\n' chmod +x
          (cd stage && zip -r -X "../dist/Easier Saving.zip" Tools)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Easier Saving
          path: dist/Easier Saving.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Easier Saving.zip
          generate_release_notes: true
