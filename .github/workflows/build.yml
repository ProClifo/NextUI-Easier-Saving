---
name: Build

# yamllint disable-line rule:truthy
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version (eg. v1.2.0), leave empty for a normal build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with sources.txt
        # NextUI's toolchain images are arm64
        include:
          - {target: nextui-tg5040, runner: ubuntu-24.04-arm}
          - {target: nextui-tg5050, runner: ubuntu-24.04-arm}
          - {target: nextui-h700, runner: ubuntu-24.04-arm}
          # MinUI toolchains are x86_64 cross compilers, except these, which use
          # Debian's native arm64 compiler
          - {target: minui-miyoomini, runner: ubuntu-24.04}
          - {target: minui-rg35xx, runner: ubuntu-24.04}
          - {target: minui-rg35xxplus, runner: ubuntu-24.04}
          - {target: minui-rgb30, runner: ubuntu-24.04}
          - {target: minui-m17, runner: ubuntu-24.04}
          - {target: minui-gkdpixel, runner: ubuntu-24.04}
          - {target: minui-my282, runner: ubuntu-24.04}
          - {target: minui-my355, runner: ubuntu-24.04-arm}
          - {target: minui-tg5040, runner: ubuntu-24.04-arm}
          - {target: minui-zero28, runner: ubuntu-24.04-arm}
          - {target: minui-magicmini, runner: ubuntu-24.04-arm}
          # minui-trimuismart: its toolchain only builds a 2016 Buildroot from
          # source, which can no longer download its sources, so it's left out
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.target }}
        run: ./scripts/build.sh ${{ matrix.target }}
        env:
          # releases report their version, everything else dev-<commit>
          PAK_VERSION: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.target }}
          path: build/stage/

  package:
    needs: build
    # package whatever built, a broken toolchain shouldn't hold back every other device
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: stage-*
          merge-multiple: true
          path: stage/

      - name: Zip
        run: |
          mkdir -p dist
          find stage -name '*.sh' -o -name '*.elf' | xargs -d '\n' chmod +x
          [ -d stage/nextui ] && (cd stage/nextui && zip -r -X "../../dist/Easier Saving (NextUI).zip" Tools)
          [ -d stage/minui ] && (cd stage/minui && zip -r -X "../../dist/Easier Saving (MinUI).zip" Tools)
          ls -la dist

      # what update.sh on the device downloads: one archive per os/platform plus
      # latest.txt with each archive's checksum and the OS commit it was built for
      - name: Update archives
        run: |
          set -e
          version=""
          for pak in stage/*/Tools/*/"Easier Saving.pak"; do
            platform="$(basename "$(dirname "$pak")")"
            os="$(cat "$pak/os.txt")"
            version="$(cat "$pak/version.txt")"
            tar -czf "dist/easier-saving-$os-$platform.tar.gz" -C "$pak" .
            sha="$(sha256sum "dist/easier-saving-$os-$platform.tar.gz" | cut -d' ' -f1)"
            echo "$os-$platform $sha $(cat "$pak/nextui-commit.txt")" >> dist/platforms.txt
            # paks from before MinUI support look for plain <platform> entries
            if [ "$os" = "nextui" ]; then
              cp "dist/easier-saving-$os-$platform.tar.gz" "dist/easier-saving-$platform.tar.gz"
              echo "$platform $sha $(cat "$pak/nextui-commit.txt")" >> dist/platforms.txt
            fi
          done
          { echo "version $version"; cat dist/platforms.txt; } > dist/latest.txt
          rm dist/platforms.txt
          cat dist/latest.txt

      - name: Upload NextUI
        uses: actions/upload-artifact@v4
        with:
          name: Easier Saving (NextUI)
          path: dist/Easier Saving (NextUI).zip
          if-no-files-found: ignore

      - name: Upload MinUI
        uses: actions/upload-artifact@v4
        with:
          name: Easier Saving (MinUI)
          path: dist/Easier Saving (MinUI).zip
          if-no-files-found: ignore

      # a pushed v* tag, or a manual run with a release version (which creates the tag)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/Easier Saving (NextUI).zip
            dist/Easier Saving (MinUI).zip
            dist/easier-saving-*.tar.gz
            dist/latest.txt
          generate_release_notes: true
