---
name: Build

# yamllint disable-line rule:truthy
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    # the NextUI toolchain images are arm64
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with targets.txt
        include:
          - {target: nextui-v6.15.0, platform: tg5040}
          - {target: nextui-v6.15.0, platform: tg5050}
          - {target: nextui-v6.15.0, platform: h700}
          - {target: pvaibhav-h700-rc11, platform: h700}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.target }} ${{ matrix.platform }}
        run: ./scripts/build.sh ${{ matrix.target }} ${{ matrix.platform }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.target }}-${{ matrix.platform }}
          path: build/stage/

  package:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [nextui-v6.15.0, pvaibhav-h700-rc11]
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: stage-${{ matrix.target }}-*
          merge-multiple: true
          path: stage/

      - name: Zip
        run: |
          mkdir -p dist
          find stage -name '*.sh' -o -name '*.elf' | xargs -d '\n' chmod +x
          (cd stage && zip -r -X "../dist/Easier Saving (${{ matrix.target }}).zip" Tools)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Easier Saving (${{ matrix.target }})
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
