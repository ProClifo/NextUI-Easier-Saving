---
name: Build

# yamllint disable-line rule:truthy
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version (eg. v1.2.0), leave empty for a normal build"
        required: false
        default: ""

permissions:
  contents: write

# NextUI and MinUI build and release separately, so a NextUI release goes out
# in minutes instead of waiting on the slower MinUI toolchains
env:
  # releases report their version, everything else dev-<commit>
  PAK_VERSION: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
  # a pushed v* tag, or a manual run with a release version (which creates the tag)
  RELEASE: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build-nextui:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with sources.txt
        # NextUI's toolchain images are arm64
        include:
          - {target: nextui-tg5040, runner: ubuntu-24.04-arm}
          - {target: nextui-tg5050, runner: ubuntu-24.04-arm}
          - {target: nextui-h700, runner: ubuntu-24.04-arm}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.target }}
        run: ./scripts/build.sh ${{ matrix.target }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.target }}
          path: build/stage/

  build-minui:
    # only a few runners are free at a time, let NextUI have them first
    needs: build-nextui
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with sources.txt
        # MinUI toolchains are x86_64 cross compilers, except the arm64 ones,
        # which use Debian's native arm64 compiler
        include:
          - {target: minui-miyoomini, runner: ubuntu-24.04}
          - {target: minui-rg35xx, runner: ubuntu-24.04}
          - {target: minui-rg35xxplus, runner: ubuntu-24.04}
          - {target: minui-rgb30, runner: ubuntu-24.04}
          - {target: minui-m17, runner: ubuntu-24.04}
          - {target: minui-gkdpixel, runner: ubuntu-24.04}
          - {target: minui-my282, runner: ubuntu-24.04}
          - {target: minui-my355, runner: ubuntu-24.04-arm}
          - {target: minui-tg5040, runner: ubuntu-24.04-arm}
          - {target: minui-zero28, runner: ubuntu-24.04-arm}
          - {target: minui-magicmini, runner: ubuntu-24.04-arm}
          # minui-trimuismart: its toolchain only builds a 2016 Buildroot from
          # source, which can no longer download its sources, so it's left out
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.target }}
        run: ./scripts/build.sh ${{ matrix.target }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: stage-${{ matrix.target }}
          path: build/stage/

  package-nextui:
    needs: build-nextui
    # package whatever built, a broken toolchain shouldn't hold back every other device
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: stage-nextui-*
          merge-multiple: true
          path: stage/

      - name: Package
        run: |
          ./scripts/package.sh nextui stage dist
          { echo "version $(cat stage/nextui/Tools/*/"Easier Saving.pak"/version.txt | head -n 1)"; cat dist/latest-nextui.txt; } > dist/latest.txt
          cat dist/latest.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Easier Saving (NextUI)
          path: dist/Easier Saving (NextUI).zip
          if-no-files-found: ignore

      - name: Release
        if: env.RELEASE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/Easier Saving (NextUI).zip
            dist/easier-saving-*.tar.gz
            dist/latest.txt
          generate_release_notes: true

  package-minui:
    # after package-nextui, so the release exists and its latest.txt can be extended
    needs: [build-minui, package-nextui]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: stage-minui-*
          merge-multiple: true
          path: stage/

      - name: Package
        run: ./scripts/package.sh minui stage dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Easier Saving (MinUI)
          path: dist/Easier Saving (MinUI).zip
          if-no-files-found: ignore

      # the release's latest.txt already lists the NextUI builds, keep those and
      # swap in the MinUI ones
      - name: Merge latest.txt
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE" -R "$GITHUB_REPOSITORY" -p latest.txt -O released.txt || : > released.txt
          {
            echo "version $RELEASE"
            awk '$1 != "version" && $1 !~ /^minui-/' released.txt
            cat dist/latest-minui.txt
          } > dist/latest.txt
          cat dist/latest.txt

      - name: Release
        if: env.RELEASE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/Easier Saving (MinUI).zip
            dist/easier-saving-minui-*.tar.gz
            dist/latest.txt
          generate_release_notes: true
